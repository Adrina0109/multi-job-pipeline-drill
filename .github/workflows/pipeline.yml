name: CI Pipeline

on:
push:
branches: ['*']
pull_request:
branches: [main]

jobs:
lint:
timeout-minutes: 10
runs-on: ubuntu-latest
steps:
- uses: actions/checkout@v4
- uses: actions/setup-node@v4
with:
node-version: '20'
- run: npm ci
- run: npm run lint

unit-tests:
# Unit tests should run only after lint passes
needs: lint
timeout-minutes: 15
runs-on: ubuntu-latest
steps:
- uses: actions/checkout@v4
- uses: actions/setup-node@v4
with:
node-version: '20'
- run: npm ci
- run: npm test

build:
# Build should run only after lint passes
needs: lint
timeout-minutes: 20
runs-on: ubuntu-latest
steps:
- uses: actions/checkout@v4
- uses: actions/setup-node@v4
with:
node-version: '20'
- run: npm ci
- run: npm run build

```
  - name: Upload build artifact
    uses: actions/upload-artifact@v4
    with:
      name: app-build
      path: dist/
```

integration-tests:
# Integration tests require the build output
needs: build
timeout-minutes: 30
runs-on: ubuntu-latest
steps:
- uses: actions/checkout@v4
- uses: actions/setup-node@v4
with:
node-version: '20'
- run: npm ci

```
  - name: Download build artifact
    uses: actions/download-artifact@v4
    with:
      name: app-build

  - run: npm run test:integration
```

deploy-staging:
# Staging deployment requires both test phases to pass
needs: [unit-tests, integration-tests]
if: github.ref == 'refs/heads/main'
timeout-minutes: 15
runs-on: ubuntu-latest
steps:
- run: echo "Deploying to staging environment"

deploy-production:
# Production deployment should happen only after staging succeeds
needs: deploy-staging
if: github.ref == 'refs/heads/main'
timeout-minutes: 15
runs-on: ubuntu-latest
steps:
- run: echo "Deploying to production environment"

notify:
if: always()
runs-on: ubuntu-latest
steps:
- run: echo "Pipeline notification sent"
